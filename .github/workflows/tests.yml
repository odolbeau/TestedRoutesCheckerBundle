on: [pull_request]
name: Tests

jobs:
  tests:
    name: PHPUnit - ${{ matrix.os }}, PHP ${{ matrix.php }}, SF ${{ matrix.symfony }} - ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.4, 8.5 ]
        deps: [ highest ]
        symfony: [ 6.4.*, 7.3.*, 7.4.*, 8.0.* ]
        include:
          - os: ubuntu-latest
            php: 8.4
            deps: lowest
            symfony: '*'
          - os: windows-latest
            php: 8.5
            deps: highest
            symfony: 8.0.*

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: --prefer-dist
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit
